<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktieberäkning</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Aktieberäkning</h1>

    <label for="purchases2021">Köp 2021 (antal aktier):</label>
    <input type="number" id="purchases2021" placeholder="Antal aktier 2021">
    
    <label for="purchases2022">Köp 2022 (antal aktier):</label>
    <input type="number" id="purchases2022" placeholder="Antal aktier 2022">
    
    <label for="purchases2023">Köp 2023 (antal aktier):</label>
    <input type="number" id="purchases2023" placeholder="Antal aktier 2023">
    
    <label for="purchases2024">Köp 2024 (antal aktier):</label>
    <input type="number" id="purchases2024" placeholder="Antal aktier 2024">

    <button onclick="calculateInvestment()">Beräkna Totalt Investering och Vinst</button>

    <div id="investmentResult">
        <!-- Resultatet av beräkningen kommer att visas här -->
    </div>

    <h2>Graf för aktiekurs (2021–2024)</h2>
    <canvas id="stockChart" width="400" height="200"></canvas>

    <h2>Graf för vinst (2021–2024)</h2>
    <canvas id="profitChart" width="400" height="200"></canvas>

    <script src="app.js"></script>
</body>
</html>
